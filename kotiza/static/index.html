<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kotiza</title>
  <meta name="theme-color" content="#0E2E2B">
  <link rel="icon" type="image/svg+xml" href="/brand/kotiza-favicon.svg">
  <link rel="apple-touch-icon" href="/brand/kotiza-app-icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
  <script>
    // Apply a saved theme choice before the page paints (system / light / dark).
    try { var t = localStorage.getItem('kotiza-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="#/estimates" aria-label="Kotiza — estimates">
      <img class="lockup" src="/brand/kotiza-lockup-reverse.svg" alt="Kotiza">
      <img class="mark" src="/brand/kotiza-mark-reverse.svg" alt="Kotiza">
    </a>
    <nav aria-label="Sections">
      <a href="#/estimates" data-nav="estimates">Estimates</a>
      <span class="nav-sep">Database</span>
      <a href="#/db/library" data-nav="library">Task library</a>
      <a href="#/db/crews" data-nav="crews">Crews</a>
      <a href="#/db/labor" data-nav="labor">Labor</a>
      <a href="#/db/equipment" data-nav="equipment">Equipment</a>
      <a href="#/db/materials" data-nav="materials">Materials</a>
      <a href="#/db/indirect-library" data-nav="indirect-library">Indirects</a>
      <a href="#/db/units" data-nav="units">Units</a>
    </nav>
    <button id="theme-btn" class="theme-btn" type="button" title="Switch between system, light and dark themes">Theme: system</button>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script src="/app.js"></script>
</body>
</html>
